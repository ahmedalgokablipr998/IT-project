<main>
    <section>
        <h2>Add New Course</h2>
        
        <form>
          <label>Course Name:</label>
          <input type="text" placeholder="Enter course name" required><br>
        
          <label>Instructor:</label>
          <input type="text" placeholder="Instructor name"><br>
        
          <label>Credit Hours:</label>
          <input type="number" min="1" max="5"><br>
        
          <label>Notes:</label>
          <textarea rows="4" placeholder="Extra notes..."></textarea><br>
        
          <button type="submit">Save Course</button>
        </form>
     </section>
